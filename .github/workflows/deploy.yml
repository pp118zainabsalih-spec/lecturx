# Publishes the app to Firebase Hosting (lecturx.com) on every push to main.
# Keyless: GitHub proves its identity to Google with a short-lived token (Workload Identity Federation),
# so no service-account key or secret is stored anywhere. Only this repository is allowed by the provider.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          project_id: lecture-61f01
          workload_identity_provider: projects/376974383870/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@lecture-61f01.iam.gserviceaccount.com

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting --project lecture-61f01 --non-interactive --message "${GITHUB_SHA::7}"
